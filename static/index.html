<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meera — Markets Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0e0f;
    --surface:   #0f1517;
    --border:    #1e2a2d;
    --accent:    #00e5a0;
    --accent-dim:#005c40;
    --red:       #ff4d4d;
    --muted:     #3a5055;
    --text:      #c8dde0;
    --text-dim:  #5a7a80;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
  }

  .shell {
    position: relative;
    width: min(480px, 94vw);
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Header bar */
  .header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .brand span {
    color: var(--accent);
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid var(--muted);
    color: var(--text-dim);
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .status-pill.connected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 229, 160, 0.06);
  }

  .status-pill.listening {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 229, 160, 0.1);
    animation: pulse-border 1.2s ease-in-out infinite;
  }

  .status-pill.speaking {
    border-color: #64b5f6;
    color: #64b5f6;
    background: rgba(100, 181, 246, 0.08);
  }

  .status-pill.error {
    border-color: var(--red);
    color: var(--red);
  }

  @keyframes pulse-border {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Main card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 36px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* Visualiser ring */
  .viz-wrap {
    position: relative;
    width: 140px;
    height: 140px;
  }

  .viz-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    transition: border-color 0.3s;
  }

  .viz-ring.active {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--accent-dim), inset 0 0 40px rgba(0,229,160,0.04);
  }

  canvas#viz {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }

  .mic-btn {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  .mic-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(0,229,160,0.05);
  }

  .mic-btn:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  .mic-btn.active {
    border-color: var(--accent);
    background: rgba(0,229,160,0.08);
    box-shadow: 0 0 24px rgba(0,229,160,0.15);
  }

  .mic-btn svg {
    width: 24px;
    height: 24px;
    fill: var(--text-dim);
    transition: fill 0.2s;
  }

  .mic-btn.active svg { fill: var(--accent); }
  .mic-btn:hover:not(:disabled) svg { fill: var(--accent); }

  /* Transcript */
  .transcript-box {
    width: 100%;
    min-height: 88px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
    position: relative;
    overflow: hidden;
  }

  .transcript-box::before {
    content: 'TRANSCRIPT';
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  #transcript-text {
    color: var(--text);
  }

  #transcript-text .agent {
    color: var(--accent);
  }

  #transcript-text .user {
    color: var(--text-dim);
  }

  /* Hint chips */
  .hints {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    border-radius: 2px;
  }

  .hint:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
    background: rgba(0,229,160,0.04);
  }

  /* Footer */
  .footer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    display: flex;
    justify-content: space-between;
  }

  /* Connecting overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,14,15,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
    transition: opacity 0.4s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay p {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="brand">MEERA / <span>MARKETS</span></div>
    <div class="status-pill" id="status-pill">OFFLINE</div>
  </div>

  <div class="card">
    <!-- Connecting overlay -->
    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <p id="overlay-msg">Connecting…</p>
    </div>

    <!-- Mic + visualiser -->
    <div class="viz-wrap">
      <div class="viz-ring" id="viz-ring"></div>
      <canvas id="viz" width="140" height="140"></canvas>
      <button class="mic-btn" id="mic-btn" disabled title="Toggle mic">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm-1 3a1 1 0 0 1 2 0v8a1 1 0 0 1-2 0V4zM7 11a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.93V21h-2v-3.07A7 7 0 0 1 5 11h2z"/>
        </svg>
      </button>
    </div>

    <!-- Transcript -->
    <div class="transcript-box">
      <div id="transcript-text"><span style="color:var(--muted)">Waiting for Meera…</span></div>
    </div>

    <!-- Hint chips -->
    <div class="hints">
      <div class="hint">How's Reliance today?</div>
      <div class="hint">What's Nifty at?</div>
      <div class="hint">Market overview</div>
      <div class="hint">How are banks doing?</div>
      <div class="hint">Show my portfolio</div>
    </div>
  </div>

  <div class="footer">
    <span>NSE / BSE · 15 MIN DELAY</span>
    <span>DEMO — NOT INVESTMENT ADVICE</span>
  </div>
</div>

<script type="module">
import {
  Room,
  RoomEvent,
  TrackEvent,
  Track,
  createLocalAudioTrack,
  ParticipantEvent,
} from "https://cdn.jsdelivr.net/npm/livekit-client@2/+esm";

// ── DOM refs ──────────────────────────────────────────────────────────────────
const statusPill   = document.getElementById("status-pill");
const overlay      = document.getElementById("overlay");
const overlayMsg   = document.getElementById("overlay-msg");
const micBtn       = document.getElementById("mic-btn");
const transcriptEl = document.getElementById("transcript-text");
const vizRing      = document.getElementById("viz-ring");
const canvas       = document.getElementById("viz");
const ctx2d        = canvas.getContext("2d");

// ── State ─────────────────────────────────────────────────────────────────────
let room, localTrack, analyser, animFrame;
let micMuted = false;

// ── Visualiser ────────────────────────────────────────────────────────────────
function startViz(stream) {
  const ac = new AudioContext();
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser();
  analyser.fftSize = 64;
  src.connect(analyser);
  drawViz();
}

function drawViz() {
  animFrame = requestAnimationFrame(drawViz);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);

  ctx2d.clearRect(0, 0, 140, 140);
  const cx = 70, cy = 70, r = 50;
  const bars = buf.length;

  buf.forEach((val, i) => {
    const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const h = (val / 255) * 28;
    const x1 = cx + Math.cos(angle) * r;
    const y1 = cy + Math.sin(angle) * r;
    const x2 = cx + Math.cos(angle) * (r + h);
    const y2 = cy + Math.sin(angle) * (r + h);
    ctx2d.beginPath();
    ctx2d.moveTo(x1, y1);
    ctx2d.lineTo(x2, y2);
    ctx2d.strokeStyle = `rgba(0,229,160,${0.3 + (val/255)*0.7})`;
    ctx2d.lineWidth = 2;
    ctx2d.stroke();
  });
}

function stopViz() {
  if (animFrame) cancelAnimationFrame(animFrame);
  ctx2d.clearRect(0, 0, 140, 140);
}

// ── Transcript helpers ────────────────────────────────────────────────────────
function appendTranscript(who, text) {
  const line = document.createElement("div");
  line.className = who;
  line.textContent = (who === "agent" ? "▶ " : "◀ ") + text;
  transcriptEl.innerHTML = "";
  transcriptEl.appendChild(line);
}

// ── Status helpers ────────────────────────────────────────────────────────────
function setStatus(label, cls) {
  statusPill.textContent = label;
  statusPill.className = "status-pill " + (cls || "");
}

// ── Connect ───────────────────────────────────────────────────────────────────
async function connect() {
  try {
    overlayMsg.textContent = "Fetching token…";
    const res  = await fetch("/token");
    const { token, url } = await res.json();

    overlayMsg.textContent = "Connecting to LiveKit…";
    room = new Room();

    room.on(RoomEvent.Disconnected, () => {
      setStatus("OFFLINE");
      micBtn.disabled = true;
      micBtn.classList.remove("active");
      stopViz();
    });

    // Remote audio from the agent
    room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind === Track.Kind.Audio) {
        track.attach(); // plays through speakers automatically
        setStatus("SPEAKING", "speaking");
        vizRing.classList.add("active");
      }
    });

    room.on(RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === Track.Kind.Audio) {
        track.detach();
        setStatus("CONNECTED", "connected");
        vizRing.classList.remove("active");
      }
    });

    // Transcript via data channel (LiveKit agents send these)
    room.on(RoomEvent.DataReceived, (payload) => {
      try {
        const msg = JSON.parse(new TextDecoder().decode(payload));
        if (msg.type === "transcript") {
          appendTranscript(msg.role === "assistant" ? "agent" : "user", msg.text);
        }
      } catch {}
    });

    await room.connect(url, token);
    overlayMsg.textContent = "Publishing mic…";

    localTrack = await createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true });
    await room.localParticipant.publishTrack(localTrack);
    startViz(localTrack.mediaStreamTrack.clone ? new MediaStream([localTrack.mediaStreamTrack]) : localTrack.mediaStreamTrack);

    overlay.classList.add("hidden");
    setStatus("CONNECTED", "connected");
    micBtn.disabled = false;
    micBtn.classList.add("active");

    appendTranscript("agent", "Connected — Meera is listening…");

  } catch (err) {
    console.error(err);
    overlayMsg.textContent = "Connection failed — " + err.message;
    setStatus("ERROR", "error");
  }
}

// ── Mic toggle ────────────────────────────────────────────────────────────────
micBtn.addEventListener("click", async () => {
  if (!localTrack) return;
  micMuted = !micMuted;
  await localTrack.mute(micMuted ? true : false);
  micBtn.classList.toggle("active", !micMuted);
  setStatus(micMuted ? "MUTED" : "CONNECTED", micMuted ? "" : "connected");
});

// ── Hint chips ────────────────────────────────────────────────────────────────
document.querySelectorAll(".hint").forEach(chip => {
  chip.addEventListener("click", () => {
    appendTranscript("user", chip.textContent);
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
